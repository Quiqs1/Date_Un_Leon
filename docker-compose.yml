name: uniconnect

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: adobe/s3mock:latest
    ports: ['9000:9000', '9001:9001']
    environment:
      initialBuckets: ${S3_BUCKET}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', 'http://localhost:9000/', '||', 'exit', '1']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports: ['8025:8025']

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: ['sh', '-c', 'pnpm exec prisma migrate deploy && node dist/server.js']
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    volumes: ['./docker/proxy/nginx.conf:/etc/nginx/nginx.conf:ro']
    ports: ['80:80']
    depends_on: [api, web]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata: